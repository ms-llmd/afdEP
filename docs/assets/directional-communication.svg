<text x="1061.0" y="775" class="call" text-anchor="middle">gin.signal(...)</text>
<text x="1061.0" y="813" class="small" text-anchor="middle">ReplyCredit</text>
<text x="48" y="851" class="small" text-anchor="start">PUT = payload + ncclGin_StrongSignalInc; receiver polls gin.readSignal().</text>
<text x="48" y="879" class="small" text-anchor="start">Ready: every active stripe. Credits: context 0, gate next buffer reuse. gin.flush(): close/drain only.</text>
<text x="48" y="907" class="small" text-anchor="start">Empty stripe: gin.signal(...) publishes readiness without a payload.</text>
<rect x="32" y="932" width="1376" height="64" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="720" y="960" class="body" text-anchor="middle">Single-domain NVLink backend: peer reads → FFN experts → reply stores → source reduction</text>
<text x="720" y="984" class="small" text-anchor="middle">No GIN calls · device epochs protect reuse</text>
