<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img" aria-labelledby="title desc">
<title id="title">afdEP directional architecture and GIN call order</title>
<desc id="desc">Two modes for the current four-source four-worker network topology. Hybrid uses rail GIN to an ingress GPU and NVLink for FFN distribution and reduction. Direct uses world GIN to individual workers and source-side reduction. In both, requests and replies use gin.put with strong readiness signals, readers poll gin.readSignal, and gin.signal returns reuse credits. The single-domain NVLink backend uses no GIN.</desc>
