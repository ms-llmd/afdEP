<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
<title id="title">Masked DeepEP and afdEP v1 reuse</title><desc id="desc">Both use the same DeepEP dispatch and combine collective transport. Masked DeepEP allocates generic receive capacity on Attention and FFN ranks. afdEP v1 removes Attention receive payload tensors and unused copy epilogues and bounds FFN receive tensors by Attention sources. Logical dummy expert slots, registered transport capacity, synchronization and Attention output reduction remain.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#52657b" stroke-width="1.5"/></marker></defs>
<rect width="1120" height="510" fill="#fff"/><g font-family="Arial, sans-serif" fill="#15243b">
<text x="28" y="38" font-size="26" font-weight="700">Same transport. AFD roles remove unused local work.</text>
<rect x="28" y="62" width="518" height="346" rx="14" fill="#f7f8fa" stroke="#ccd5e0"/><text x="50" y="98" font-size="23" font-weight="700">Masked DeepEP</text>
<rect x="50" y="134" width="208" height="142" rx="12" fill="white" stroke="#a5b9d0"/><text x="154" y="164" text-anchor="middle" font-size="18" font-weight="700">Attention sources</text>
<text x="154" y="191" text-anchor="middle" font-size="15" fill="#52657b">Send routed tokens</text>
<text x="154" y="220" text-anchor="middle" font-size="15" fill="#52657b">Receive combined output</text>
<text x="154" y="249" text-anchor="middle" font-size="13" fill="#52657b">Unused receive payload arena</text>
<rect x="316" y="134" width="208" height="142" rx="12" fill="white" stroke="#a5b9d0"/><text x="420" y="164" text-anchor="middle" font-size="18" font-weight="700">FFN expert workers</text>
<text x="420" y="191" text-anchor="middle" font-size="15" fill="#52657b">Own real experts</text>
<text x="420" y="220" text-anchor="middle" font-size="15" fill="#52657b">Originate zero tokens</text>
<text x="420" y="249" text-anchor="middle" font-size="13" fill="#52657b">All-rank receive bounds</text>
<path d="M261 192 H312" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><path d="M312 239 H261" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="287" y="185" text-anchor="middle" font-size="11">dispatch</text><text x="287" y="260" text-anchor="middle" font-size="11">combine</text>
<text x="50" y="317" font-size="17" fill="#52657b">Generic dispatch copy on Attention</text>
<text x="50" y="345" font-size="17" fill="#52657b">Generic combine epilogue on FFN</text>
<text x="50" y="384" font-size="14" fill="#52657b">Useful payload: Attention → FFN → Attention</text>
<rect x="574" y="62" width="518" height="346" rx="14" fill="#f2f7ff" stroke="#ccd5e0"/><text x="596" y="98" font-size="23" font-weight="700">afdEP v1 · DeepEP reuse</text>
<rect x="596" y="134" width="208" height="142" rx="12" fill="white" stroke="#a5b9d0"/><text x="700" y="164" text-anchor="middle" font-size="18" font-weight="700">Attention sources</text>
<text x="700" y="191" text-anchor="middle" font-size="15" fill="#52657b">Send routed tokens</text>
<text x="700" y="220" text-anchor="middle" font-size="15" fill="#52657b">Receive combined output</text>
<text x="700" y="249" text-anchor="middle" font-size="13" fill="#147849">No receive payload arena</text>
<rect x="862" y="134" width="208" height="142" rx="12" fill="white" stroke="#a5b9d0"/><text x="966" y="164" text-anchor="middle" font-size="18" font-weight="700">FFN expert workers</text>
<text x="966" y="191" text-anchor="middle" font-size="15" fill="#52657b">Own real experts</text>
<text x="966" y="220" text-anchor="middle" font-size="15" fill="#52657b">Receive only from sources</text>
<text x="966" y="249" text-anchor="middle" font-size="13" fill="#147849">Source-count receive bounds</text>
<path d="M807 192 H858" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/><path d="M858 239 H807" stroke="#52657b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="833" y="185" text-anchor="middle" font-size="11">dispatch</text><text x="833" y="260" text-anchor="middle" font-size="11">combine</text>
<text x="596" y="317" font-size="17" fill="#147849">Skip unused Attention dispatch-copy epilogue</text>
<text x="596" y="345" font-size="17" fill="#147849">Skip unused FFN combine-output epilogue</text>
<text x="596" y="384" font-size="14" fill="#52657b">Useful payload: Attention → FFN → Attention</text>
<text x="28" y="443" font-size="17" font-weight="700">Both retain DeepEP collective participation, logical expert slots, transport buffers and credits.</text>
<text x="28" y="474" font-size="15" fill="#52657b">V1 optimizes local buffers and epilogues. Attention output reduction remains. Validated within one NVLink domain.</text>
</g></svg>
