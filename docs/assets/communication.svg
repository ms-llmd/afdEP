<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">afdEP: tokens to experts and back</title>
<desc id="desc">One MoE-layer round trip in afdEP's current backend: four Attention GPUs (group ranks 4-7) and four FFN GPUs (group ranks 0-3), each role in its own four-GPU NVLink domain, joined by NCCL GIN GPU-initiated RDMA with one rail per Attention j / FFN j pair. 1: source_dispatch(x, expert_ids, weights) on each Attention GPU sends each token once as a request on its rail. 2: worker_receive() on every FFN GPU gathers, over NVLink, the rows routed to its own quarter of the experts (experts 0-31, 32-63, 64-95, 96-127 for E = 128) from all four requests. 3: the caller runs expert compute and multiplies by the routing weights exactly once. 4: worker_reply(weighted_rows, receipt) sums partial results over NVLink and sends one row per token back over the rail. 5: source_collect(out) receives the combined result. A strip shows the Masked DeepEP baseline: all eight GPUs join one symmetric EP group, every GPU has token and expert slots, and the unused one is masked; useful payload already flows Attention to FFN to Attention, but the protocol, bookkeeping and registered buffers stay general all-to-all. Only the implemented 4 + 4 layout with one in-flight lane is shown; other N/M layouts are not implemented.</desc>
