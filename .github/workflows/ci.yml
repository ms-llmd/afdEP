name: CPU checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build pytest ruff
      - run: python -m pip install --no-deps .
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python -m build
      - run: python tests/check_distribution.py
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Inspect installed wheel without CUDA
        run: >-
          python -I -c "import afdep; from pathlib import Path;
          assert afdep.Config(8, 256, 8, 2, 2, 2).role_aware;
          assert (Path(afdep.__file__).parent / 'third_party/deepep_v2/deep_ep/include/deep_ep/impls/dispatch.cuh').is_file()"
